[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-agent"
version = "0.1.0"
description = "Financial analyst agent built over the Financial Agent Program"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "yfinance>=0.2.50",
    "requests>=2.32",
    "rich>=13.9",
]

[project.optional-dependencies]
# ruff and nbstripout are pinned to the same minor version that
# .pre-commit-config.yaml pins its hooks to. If those two drift, your editor
# formats a file one way on save and the hook formats it another way on commit,
# and the diff never settles. Change them together, or not at all.
dev = [
    "pytest>=8.3",
    "ruff>=0.17.4,<0.18",
    "pre-commit>=4.0",
    "nbstripout>=0.9.1,<0.10",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# This package lives under src/, which ruff does not infer. Without this it sorts
# `fin_agent` imports as third-party, the editor formats one way on save and the
# pre-commit hook formats the other way on commit, and the diff never settles.
known-first-party = ["fin_agent"]
