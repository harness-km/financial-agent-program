labels: ["submission"]
body:
  - type: input
    id: week
    attributes:
      label: Week
      placeholder: "04"
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: Link to your work
      description: >-
        Optional. Your fork, a branch, a notebook, a gist — anything you want
        people to be able to look at. Leave it blank if you would rather not.
    validations:
      required: false

  - type: textarea
    id: spec
    attributes:
      label: The spec I wrote
    validations:
      required: true

  - type: textarea
    id: prompts
    attributes:
      label: Prompts I used
      description: In order, including the ones that went wrong.
    validations:
      required: true

  - type: textarea
    id: ledger
    attributes:
      label: Cost ledger row
      placeholder: "model | calls | tokens in | tokens out | cost | eval score"
    validations:
      required: true

  - type: textarea
    id: broke
    attributes:
      label: What broke and how I found it
    validations:
      required: true

  - type: textarea
    id: unclear
    attributes:
      label: Anything I could not explain
      description: Optional, and the most useful thing you can post.
